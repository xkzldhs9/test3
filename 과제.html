<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장르 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --ink:#EDE8DF; --muted:#8E887E; --panel:#121212; --line:#2C2C2C;
  --accent:#CBBFA3; --accent2:#7FA8A2; --shadow:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:680px;margin:0 auto;padding:2.5rem 1rem 4rem}
h1{font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:600;color:var(--accent);
  font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.2;margin:0;letter-spacing:-.025em}
.lede{color:var(--muted);margin:.7rem 0 2rem}
.form{display:grid;gap:.7rem;background:var(--panel);border:1px solid var(--line);
  border-radius:18px;padding:1.1rem;box-shadow:0 2px 0 var(--shadow)}
label{font-size:.85rem;font-weight:500;color:var(--muted);letter-spacing:.01em}
input{font:inherit;width:100%;padding:.75rem .9rem;border:1.5px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
button{font:inherit;font-weight:600;letter-spacing:-.01em;border:0;border-radius:999px;padding:.8rem 1.5rem;cursor:pointer;
  background:var(--ink);color:var(--bg)}
button:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:.25rem}
.status{margin-top:1.2rem;color:var(--muted);min-height:1.6em}
.card{margin-top:2rem;background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:1.4rem;box-shadow:0 2px 0 var(--shadow);display:flex;gap:1.1rem;align-items:flex-start;flex-wrap:wrap}
.card img{width:112px;height:112px;border-radius:12px;object-fit:cover;background:var(--line);flex:0 0 auto}
.card .info{flex:1 1 220px;min-width:0}
.genre{font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:600;color:var(--accent);letter-spacing:-.02em;
  font-size:clamp(1.7rem,5.5vw,2.3rem);line-height:1.2;margin:0 0 .4rem;word-break:keep-all}
.meta{margin:0;color:var(--muted);font-size:.95rem;overflow-wrap:anywhere}
.meta b{color:var(--ink);font-weight:600}
h2{font-size:1rem;color:var(--muted);margin:2.2rem 0 .6rem;font-weight:600}
ul{list-style:none;padding:0;margin:0;display:grid;gap:.5rem}
li button{width:100%;text-align:left;display:flex;gap:.75rem;align-items:center;background:var(--panel);
  color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.6rem;font-weight:400}
li button:hover{border-color:var(--ink)}
li img{width:44px;height:44px;border-radius:7px;object-fit:cover;background:var(--line);flex:0 0 auto}
li .t{min-width:0;flex:1}
li .t strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .t span{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
li .g{color:var(--accent2);font-size:.85rem;font-weight:500;flex:0 0 auto}
li .play{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink);font-size:.7rem;line-height:1}
li button[aria-pressed="true"]{border-color:var(--accent2)}
li button[aria-pressed="true"] .play{border-color:var(--accent2);color:var(--accent2)}
#recList li button{cursor:pointer}
footer{margin-top:3rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:1rem}
</style>
</head>
<body>
<main>
  <h1>장르 검색</h1>
  <p class="lede">노래 제목과 가수를 입력하면 장르를 찾아 드려요.</p>

  <div class="form" id="form">
    <div class="field">
      <label for="title">노래 제목</label>
      <input id="title" type="text" autocomplete="off" placeholder="예: Dynamite">
    </div>
    <div class="field">
      <label for="artist">가수 <span style="font-weight:400">(몰라도 괜찮아요)</span></label>
      <input id="artist" type="text" autocomplete="off" placeholder="예: BTS">
    </div>
    <button type="button" id="go">장르 찾기</button>
  </div>

  <p class="status" id="status" role="status"></p>

  <section id="result" hidden aria-live="polite">
    <div class="card">
      <img id="art" alt="" width="112" height="112">
      <div class="info">
        <p class="genre" id="genre"></p>
        <p class="meta" id="meta"></p>
      </div>
    </div>
  </section>

  <section id="recs" hidden>
    <h2 id="recsTitle"></h2>
    <ul id="recList"></ul>
  </section>

  <section id="others" hidden>
    <h2>찾던 노래가 아닌가요? 아래에서 골라 보세요</h2>
    <ul id="list"></ul>
  </section>

  <footer>장르 정보는 Apple iTunes 검색을 이용합니다. 같은 노래라도 앨범이나 발매판에 따라 장르가 다르게 적혀 있을 수 있어요.</footer>
</main>

<script>
const $=id=>document.getElementById(id);
const form=$('form'), status=$('status'), result=$('result'), others=$('others'), list=$('list'), go=$('go');

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='itcb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{done();reject(new Error('timeout'));},12000);
    function done(){ clearTimeout(timer); try{delete window[cb];}catch{window[cb]=undefined;} s.remove(); }
    window[cb]=data=>{ done(); resolve(data); };
    s.onerror=()=>{ done(); reject(new Error('network')); };
    s.src=url+'&callback='+cb;
    document.body.appendChild(s);
  });
}

async function search(term,limit){
  const base='https://itunes.apple.com/search?media=music&entity=song&limit='+(limit||12)
    +'&country=KR&term='+encodeURIComponent(term);
  // iTunes 검색 API는 CORS 헤더를 주지 않으므로 JSONP를 먼저 쓴다.
  try{
    const d=await jsonp(base);
    return d.results||[];
  }catch(e){
    const r=await fetch(base);           // 프록시 뒤에 있는 환경 대비
    if(!r.ok) throw new Error('http '+r.status);
    return (await r.json()).results||[];
  }
}

const norm=s=>(s||'').toLowerCase().replace(/[\s\-_'’".,!?()\[\]]/g,'');

function score(t,title,artist){
  const nt=norm(t.trackName), na=norm(t.artistName);
  const qt=norm(title), qa=norm(artist);
  let s=0;
  if(nt===qt) s+=6; else if(nt.startsWith(qt)) s+=4; else if(nt.includes(qt)) s+=2;
  if(qa){ if(na===qa) s+=6; else if(na.includes(qa)||qa.includes(na)) s+=3; }
  return s;
}

function big(url,px){ return url ? url.replace(/\/\d+x\d+bb\./,'/'+px+'x'+px+'bb.') : ''; }

function render(t){
  $('genre').textContent=t.primaryGenreName||'장르 정보 없음';
  $('art').src=big(t.artworkUrl100,300); $('art').alt=(t.collectionName||t.trackName)+' 앨범 표지';
  const year=t.releaseDate?t.releaseDate.slice(0,4):'';
  const meta=$('meta'); meta.innerHTML='';
  const b=document.createElement('b'); b.textContent=t.trackName; meta.appendChild(b);
  meta.appendChild(document.createTextNode(' — '+t.artistName));
  if(t.collectionName||year){
    meta.appendChild(document.createElement('br'));
    meta.appendChild(document.createTextNode([t.collectionName,year].filter(Boolean).join(' · ')));
  }
  result.hidden=false;
  result.scrollIntoView({block:'nearest',behavior:'smooth'});
  recommend(t.primaryGenreName, t);   // 같은 장르의 다른 곡 추천
}

function renderOthers(items){
  list.innerHTML='';
  if(!items.length){ others.hidden=true; return; }
  items.forEach(t=>{
    const li=document.createElement('li');
    const btn=document.createElement('button'); btn.type='button';
    const img=document.createElement('img'); img.src=t.artworkUrl100||''; img.alt='';
    const d=document.createElement('span'); d.className='t';
    const st=document.createElement('strong'); st.textContent=t.trackName;
    const sp=document.createElement('span'); sp.textContent=t.artistName;
    d.append(st,sp);
    const g=document.createElement('span'); g.className='g'; g.textContent=t.primaryGenreName||'';
    btn.append(img,d,g);
    btn.addEventListener('click',()=>render(t));
    li.appendChild(btn); list.appendChild(li);
  });
  others.hidden=false;
}

/* ---- 장르별 추천곡 ---- */
const audio=new Audio(); let playingBtn=null;
audio.addEventListener('ended',()=>{ if(playingBtn){ playingBtn.setAttribute('aria-pressed','false');
  playingBtn.querySelector('.play').textContent='▶'; playingBtn=null; } });

function toggle(btn,url){
  const icon=btn.querySelector('.play');
  if(playingBtn===btn){ audio.pause(); btn.setAttribute('aria-pressed','false'); icon.textContent='▶'; playingBtn=null; return; }
  if(playingBtn){ playingBtn.setAttribute('aria-pressed','false'); playingBtn.querySelector('.play').textContent='▶'; }
  audio.src=url; audio.play().catch(()=>{});
  btn.setAttribute('aria-pressed','true'); icon.textContent='❚❚'; playingBtn=btn;
}

async function recommend(genre, seed){
  const recs=$('recs'), ul=$('recList');
  ul.innerHTML=''; recs.hidden=true; playingBtn=null; audio.pause();
  if(!genre) return;
  let pool=[];
  try{ pool=await search(genre,50); }catch{ return; }
  const seen=new Set([norm(seed.artistName)]);
  const picks=[];
  for(const t of pool){
    if((t.primaryGenreName||'')!==genre) continue;
    if(norm(t.trackName)===norm(seed.trackName)) continue;
    const k=norm(t.artistName);
    if(seen.has(k)) continue;              // 가수당 한 곡씩만
    seen.add(k); picks.push(t);
    if(picks.length===5) break;
  }
  if(!picks.length) return;
  $('recsTitle').textContent=genre+' 장르에서 들어볼 만한 곡';
  picks.forEach(t=>{
    const li=document.createElement('li');
    const btn=document.createElement('button'); btn.type='button';
    btn.setAttribute('aria-pressed','false');
    const img=document.createElement('img'); img.src=t.artworkUrl100||''; img.alt='';
    const d=document.createElement('span'); d.className='t';
    const st=document.createElement('strong'); st.textContent=t.trackName;
    const sp=document.createElement('span'); sp.textContent=t.artistName;
    d.append(st,sp);
    const y=document.createElement('span'); y.className='g';
    y.textContent=t.releaseDate?t.releaseDate.slice(0,4):'';
    btn.append(img,d,y);
    if(t.previewUrl){
      const p=document.createElement('span'); p.className='play'; p.textContent='▶';
      btn.appendChild(p);
      btn.title='30초 미리듣기';
      btn.addEventListener('click',()=>toggle(btn,t.previewUrl));
    }else{
      btn.style.cursor='default';
    }
    li.appendChild(btn); ul.appendChild(li);
  });
  recs.hidden=false;
}

async function run(){
  const title=$('title').value.trim(), artist=$('artist').value.trim();
  if(!title){ $('title').focus(); return; }
  go.disabled=true; status.textContent='찾는 중…';
  result.hidden=true; others.hidden=true; $('recs').hidden=true;
  try{
    let items=await search([title,artist].filter(Boolean).join(' '));
    if(!items.length && artist) items=await search(title);
    if(!items.length){
      status.textContent='그런 노래를 찾지 못했어요. 제목의 철자나 영어 표기를 확인해 보세요.';
      return;
    }
    const sorted=items.map(t=>({t,s:score(t,title,artist)})).sort((a,b)=>b.s-a.s).map(x=>x.t);
    status.textContent='';
    render(sorted[0]);
    renderOthers(sorted.slice(1,8));
  }catch(err){
    console.error(err);
    status.textContent='검색에 실패했어요. 인터넷 연결을 확인하고 다시 시도해 주세요. ('+(err&&err.message||err)+')';
  }finally{ go.disabled=false; }
}

go.addEventListener('click', run);
['title','artist'].forEach(id=>$(id).addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); run(); }
}));
window.addEventListener('error',e=>{ status.textContent='오류가 발생했어요: '+e.message; });
</script>
</body>
</html>
